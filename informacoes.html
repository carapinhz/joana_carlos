<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informações · Joana & Carlos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#102c52;--paper:#f6f2e9;--paper2:#fbf8f1}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--paper2),var(--paper));color:var(--navy);font-family:Montserrat,Arial,sans-serif}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:min(760px,100%);text-align:center;background:rgba(251,248,241,.94);border:1px solid rgba(16,44,82,.12);padding:48px 7vw 56px;box-shadow:0 12px 45px rgba(16,44,82,.07)}
.monogram{display:flex;align-items:center;justify-content:center;gap:22px;color:var(--navy);line-height:.8;margin:0 auto 24px}
.monogram span:first-child,.monogram span:last-child{font-family:Allura,"Brush Script MT",cursive;font-size:clamp(90px,20vw,140px)}
.bar{width:4px;height:clamp(82px,16vw,120px);background:var(--navy)}
.eyebrow{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
h1{margin:0;font-family:Allura,"Brush Script MT",cursive;font-size:clamp(58px,10vw,88px);font-weight:400;line-height:.95}
.rule{width:72px;height:1px;background:var(--navy);opacity:.3;margin:28px auto 30px}
.message{max-width:600px;margin:0 auto;font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;line-height:1.45}
.back{display:inline-block;margin-top:34px;color:var(--navy);text-decoration:none;border-bottom:1px solid rgba(16,44,82,.35);padding-bottom:3px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:620px){.card{padding:36px 20px 44px}.message{font-size:21px}}
</style>
</head>
<body><main class="page"><section class="card">
<div class="monogram" aria-label="Joana & Carlos"><span>J</span><span class="bar"></span><span>C</span></div>
<p class="eyebrow">Joana & Carlos · 15 · 08 · 2027</p>
<h1>Informações</h1><div class="rule"></div>
<p class="message">Preparámos este espaço para partilhar convosco todas as informações importantes. À medida que o dia se aproxima, poderão encontrar aqui eventuais atualizações.</p>
<a class="back" href="index.html">← Voltar ao convite</a>
</section></main></body></html>
