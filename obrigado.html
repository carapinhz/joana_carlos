<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obrigado · Joana & Carlos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#102c52;--paper:#f6f2e9;--paper2:#fbf8f1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--paper2),var(--paper));color:var(--navy);font-family:Montserrat,Arial,sans-serif}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(720px,100%);text-align:center;background:rgba(251,248,241,.94);border:1px solid rgba(16,44,82,.12);padding:58px 30px 64px;box-shadow:0 12px 45px rgba(16,44,82,.07)}
.logo{width:min(170px,55vw);margin:0 auto 30px;display:block}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;margin:0 0 12px}
h1{font-family:Allura,"Brush Script MT",cursive;font-size:clamp(58px,10vw,88px);font-weight:400;line-height:.95;margin:0}
.message{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;line-height:1.4;max-width:520px;margin:24px auto 0}
.date{font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin-top:30px}
.rule{width:70px;height:1px;background:var(--navy);opacity:.3;margin:28px auto}
a{display:inline-block;background:var(--navy);color:white;text-decoration:none;padding:14px 28px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-top:8px}
</style>
</head>
<body>
<main class="page">
<section class="card">
<img class="logo" src="https://i.ibb.co/k6PxxBJ6/joana-carlos-logotipo-maxima-qualidade-sem-fundo-1.png" alt="Joana & Carlos">
<p class="eyebrow">A tua resposta foi enviada</p>
<h1>Obrigado</h1>
<p class="message">Estamos muito felizes por partilhares este dia tão especial connosco.</p>
<div class="rule"></div>
<p class="date">Joana & Carlos · 15 · 08 · 2027</p>
<a href="index.html">Voltar ao convite</a>
</section>
</main>
</body>
</html>
